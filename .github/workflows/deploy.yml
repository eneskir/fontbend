name: Deploy

# Every push to main goes to fontbend.com. The secret scan runs again here because
# a commit that reached main without a pull request must not reach the site.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Secret scan
        run: python3 tools/secret_scan.py

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Build the app
        run: |
          npm ci --ignore-scripts
          npm run build

      # The app is the home page; site/ adds About, the 404 page, the icons and their fonts.
      - name: Put the app and site/ together
        run: |
          python3 tools/check_site_cache.py dist site
          python3 tools/assemble_site.py "$RUNNER_TEMP/site"

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.162.0"
          command: pages deploy ${{ runner.temp }}/site --project-name=fontbend --branch=main --commit-hash=${{ github.sha }}

      # Every page carries the app's security policies; fontbend.com is open to search engines
      # (Cloudflare adds noindex to the deployment's own pages.dev address, never to the
      # domain); a named font is kept for a year.
      - name: Check the site's headers
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          for page in / /about/; do
            curl -sfI --retry 5 --retry-all-errors "$URL$page" > headers.txt
            grep -qi '^content-security-policy:' headers.txt
            grep -qi '^cross-origin-opener-policy: same-origin' headers.txt
            curl -sfI --retry 5 --retry-all-errors "https://fontbend.com$page" > live.txt
            if grep -qi '^x-robots-tag:' live.txt; then echo "fontbend.com$page has X-Robots-Tag"; exit 1; fi
          done
          font=$(grep -o '/fonts/recursive-text\.[0-9a-f]*\.woff2' site/about/index.html | head -1)
          curl -sfI --retry 5 --retry-all-errors "$URL$font" | grep -qi '^cache-control:.*immutable'
