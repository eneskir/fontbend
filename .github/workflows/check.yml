name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Secret scan
        run: python3 tools/secret_scan.py

      # site/ alone is what fontbend.com serves; site/ with preview/ on top is what the
      # preview address serves. Both must hold.
      - name: Cache-safe file names
        run: |
          python3 tools/check_site_cache.py site
          python3 tools/check_site_cache.py site preview

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # Packages' own install scripts never run; nothing Fontbend uses needs them.
      - name: Install tools
        run: npm ci --ignore-scripts

      - name: Licenses of installed packages
        run: python3 tools/check_licenses.py

      - name: Type check, tests, build
        run: |
          npm run check
          npm test
          npm run build

      # The title is passed through the environment, never pasted into the command,
      # so a crafted title cannot change what runs.
      - name: Pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: python3 tools/check_pr_title.py
