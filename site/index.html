<style>
@font-face {
  font-family: "Recursive Sans";
  src: url("/fonts/recursive-sans.4b801a95.woff2") format("woff2");
  font-weight: 400 700;
  font-display: swap;
}
:root {
  --paper: #FAFAF7;
  --surface: #EFEEE9;
  --line: #E2E0DA;
  --ink: #161616;
  --ink-muted: #5E5D58;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #1A1A18;
    --surface: #232320;
    --line: #34332F;
    --ink: #ECEAE4;
    --ink-muted: #A6A49D;
  }
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  display: flex;
  flex-direction: column;
  background: var(--paper);
  color: var(--ink);
  font-family: "Recursive Sans", system-ui, sans-serif;
  font-size: 14px;
  line-height: 20px;
}
main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 24px;
  padding: 16px;
}
/* The logo takes the form the space allows: stacked when there is room, side by side when the
   height is short, the mark alone when both are tight. The wordmark is the same size in each. */
.logo { display: none; }
.is-mark { display: block; }
@media (min-width: 240px) {
  .is-mark { display: none; }
  .is-wide { display: block; }
}
@media (min-width: 200px) and (min-height: 280px) {
  .is-mark, .is-wide { display: none; }
  .is-stacked { display: block; }
}
p { color: var(--ink-muted); }
</style>
