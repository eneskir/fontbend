<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fontbend</title>
<meta name="description" content="Fontbend, a free and open-source font maker. Soon.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:,">
<link rel="preload" href="/fonts/recursive-sans.4b801a95.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face {
  font-family: "Recursive Sans";
  src: url("/fonts/recursive-sans.4b801a95.woff2") format("woff2");
  font-weight: 400 700;
  font-display: swap;
}
:root {
  --paper: #FAFAF7;
  --surface: #EFEEE9;
  --line: #E2E0DA;
  --ink: #161616;
  --ink-muted: #5E5D58;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #1A1A18;
    --surface: #232320;
    --line: #34332F;
    --ink: #ECEAE4;
    --ink-muted: #A6A49D;
  }
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  display: flex;
  flex-direction: column;
  background: var(--paper);
  color: var(--ink);
  font-family: "Recursive Sans", system-ui, sans-serif;
  font-size: 14px;
  line-height: 20px;
}
header {
  display: flex;
  align-items: center;
  height: 40px;
  padding: 0 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
h1 { font-size: 16px; font-weight: 600; line-height: 24px; }
main {
  flex: 1;
  display: grid;
  place-items: center;
  padding: 16px;
}
p { color: var(--ink-muted); }
</style>
</head>
<body>
<header><h1>Fontbend</h1></header>
<main><p>Soon</p></main>
</body>
</html>
