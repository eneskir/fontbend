name: Check

on:
  # "edited" reruns the job when the title changes; the default types would leave an
  # edited title unchecked when the pull request is squashed.
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Secret scan
        run: python3 tools/secret_scan.py

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # Packages' own install scripts never run; nothing Fontbend uses needs them.
      - name: Install tools
        run: npm ci --ignore-scripts

      - name: Licenses of installed packages
        run: python3 tools/check_licenses.py

      # The deploy uploads with this Wrangler, installed without install scripts.
      - name: Wrangler runs from the lockfile
        run: npx --no-install wrangler --version

      - name: Type check, tests, build
        run: |
          npm run check
          npm test
          npm run build

      # fontbend.com serves the built app with site/ on top, as the deploy puts them together.
      - name: Cache-safe file names, links and the assembled site
        run: |
          python3 tools/check_site_cache.py dist site
          python3 tools/assemble_site.py "$RUNNER_TEMP/site"

      # The title is passed through the environment, never pasted into the command,
      # so a crafted title cannot change what runs.
      - name: Pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: python3 tools/check_pr_title.py
