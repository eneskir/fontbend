<title>Fontbend</title>

<style>
@font-face {
  font-family: "Recursive Sans";
  src: url("/fonts/recursive-sans.4b801a95.woff2") format("woff2");
  font-weight: 400 700;
  font-display: swap;
}
/* Dark is the default, as in the font maker, whatever the computer's theme. The light tokens
   answer the font maker's Theme pick (data-theme="light") once it runs on this address. */
:root {
  color-scheme: dark;
  --paper: #1A1A18;
  --surface: #232320;
  --line: #34332F;
  --line-strong: #7D7B74;
  --ink: #ECEAE4;
  --ink-muted: #A6A49D;
}
:root[data-theme="light"] {
  color-scheme: light;
  --paper: #FAFAF7;
  --surface: #EFEEE9;
  --line: #E2E0DA;
  --line-strong: #82807A;
  --ink: #161616;
  --ink-muted: #5E5D58;
}
/* Scrollbars as in the font maker: a thin bar with a 1 px corner, no arrows. */
::-webkit-scrollbar { width: 12px; height: 12px; }
::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
::-webkit-scrollbar-button { display: none; }
::-webkit-scrollbar-thumb { background: var(--line-strong); background-clip: padding-box; border: 4px solid transparent; border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background-color: var(--ink-muted); }
@supports not selector(::-webkit-scrollbar) { * { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; } }
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  display: flex;
  flex-direction: column;
  background: var(--paper);
  color: var(--ink);
  font-family: "Recursive Sans", system-ui, sans-serif;
  font-size: 14px;
  line-height: 20px;
}
main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 24px;
  padding: 16px;
}
/* The logo takes the form the space allows: stacked when there is room, the wordmark alone when
   the height is short, the mark alone when both are tight. The wordmark is the same size in each. */
.logo { display: none; }
.is-mark { display: block; }
@media (min-width: 200px) {
  .is-mark { display: none; }
  .is-wide { display: block; }
}
@media (min-width: 200px) and (min-height: 280px) {
  .is-mark, .is-wide { display: none; }
  .is-stacked { display: block; }
}
p { color: var(--ink-muted); }
</style>
