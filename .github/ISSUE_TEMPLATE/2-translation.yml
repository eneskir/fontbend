name: Translation
description: A wrong or missing text in the interface, or a new language.
labels: ["translation"]
body:
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: Turkish
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where is the text?
      description: The screen or panel, and the current text if there is one.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested text
    validations:
      required: true
