name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Secret scan
        run: python3 tools/secret_scan.py

      # site/ alone is what fontbend.com serves; site/ with preview/ on top is what the
      # preview address serves. Both must hold.
      - name: Cache-safe file names
        run: |
          python3 tools/check_site_cache.py site
          python3 tools/check_site_cache.py site preview

      # The title is passed through the environment, never pasted into the command,
      # so a crafted title cannot change what runs.
      - name: Pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: python3 tools/check_pr_title.py
